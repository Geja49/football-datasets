name: Récolter les données du jour

on:
  schedule:
    # 23h heure de l'Est (UTC-4 en été) = 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  recolter:
    name: Collecter et sauver le JSON du jour
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests==2.32.3

      - name: Recolter les 5 championnats
        run: python scripts/collecter_cinq_championnats.py

      - name: Recolter la Ligue des champions
        run: python scripts/collecter_ligue_champions.py

      - name: Sauver le JSON du jour
        run: python scripts/sauver_donnees_du_jour.py

      - name: Verifier que les donnees sont completes
        run: python scripts/verifier_donnees.py

      - name: Sauvegarder sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapports/donnees/
          if git diff --cached --quiet; then
            echo "Aucun changement aujourd'hui."
          else
            git commit -m "Ajouter les données du jour"
            git push
          fi
